name: Bug report
description: Report a reproducible adapter problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please use synthetic events only. Do not paste credentials, real OpenIDs or customer messages."
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Node version, adapter version, synthetic input and steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
